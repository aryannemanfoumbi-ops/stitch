<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>GlamAtHome — Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "primary": "#8d4d3b",
              "primary-container": "#f4a28c",
              "primary-fixed": "#ffdbd1",
              "on-primary": "#ffffff",
              "on-surface": "#1a1c1a",
              "on-surface-variant": "#53433f",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f4f3f1",
              "outline-variant": "#d8c2bc",
              "background": "#faf9f6",
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Be Vietnam Pro"],
            },
          },
        },
      }
    </script>
    <style>
        body { background: #faf9f6; min-height: 100dvh; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
        .delay-100 { animation-delay: 0.1s; opacity: 0; }
        .delay-200 { animation-delay: 0.2s; opacity: 0; }
        .delay-300 { animation-delay: 0.3s; opacity: 0; }
    </style>
</head>
<body class="flex items-center justify-center p-6 font-body text-on-surface antialiased">

    <div class="w-full max-w-sm">
        <!-- Logo / Brand -->
        <div class="text-center mb-10 animate-fade-up">
            <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shadow-lg shadow-primary/20">
                <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">spa</span>
            </div>
            <h1 class="font-headline font-extrabold text-3xl tracking-tight text-primary">GlamAtHome</h1>
            <p class="text-on-surface-variant text-sm mt-2 font-medium">Luxury beauty, delivered to you</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5 animate-fade-up delay-100">
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Email</label>
                <input type="email" id="login-email" required
                    class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-xl px-4 py-3.5 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary-container focus:border-primary transition-all"
                    placeholder="your@email.com" />
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Password</label>
                <input type="password" id="login-password" required
                    class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-xl px-4 py-3.5 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary-container focus:border-primary transition-all"
                    placeholder="••••••••" />
            </div>
            <button type="submit" id="login-submit"
                class="w-full bg-gradient-to-br from-primary to-primary-container text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all text-sm uppercase tracking-widest">
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-8 animate-fade-up delay-200">
            <div class="flex-1 h-px bg-outline-variant/30"></div>
            <span class="text-xs text-on-surface-variant font-bold uppercase tracking-widest">or</span>
            <div class="flex-1 h-px bg-outline-variant/30"></div>
        </div>

        <!-- Google Sign In (Firebase) -->
        <button id="google-signin"
            class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest border border-outline-variant/30 rounded-xl py-3.5 font-semibold text-on-surface hover:bg-surface-container-low active:scale-[0.98] transition-all animate-fade-up delay-200">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
        </button>

        <!-- Guest mode -->
        <button id="guest-signin"
            class="w-full mt-4 text-primary font-semibold text-sm hover:underline active:scale-95 transition-all animate-fade-up delay-300">
            Continue as Guest
        </button>
    </div>

    <!-- Firebase Auth -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQlgAINBRM3YvG_GGGF4J2gsEstoBDe6k",
            authDomain: "glamathome-30bfd.firebaseapp.com",
            projectId: "glamathome-30bfd",
            storageBucket: "glamathome-30bfd.firebasestorage.app",
            messagingSenderId: "126884062776",
            appId: "1:126884062776:web:24a303108fbb611af0e8cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // If already logged in, go straight to app
        if (sessionStorage.getItem('glamathome_user')) {
            window.location.href = 'index.html';
        }

        // Email/password login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-submit');

            try {
                btn.innerText = 'Signing in...';
                btn.disabled = true;
                const result = await signInWithEmailAndPassword(auth, email, password);
                sessionStorage.setItem('glamathome_user', JSON.stringify({
                    uid: result.user.uid,
                    displayName: result.user.displayName || email.split('@')[0],
                    email: result.user.email,
                    photoURL: result.user.photoURL
                }));
                window.location.href = 'index.html';
            } catch (err) {
                alert('Login failed: ' + err.message);
                btn.innerText = 'Sign In';
                btn.disabled = false;
            }
        });

        // Google sign in
        document.getElementById('google-signin').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                sessionStorage.setItem('glamathome_user', JSON.stringify({
                    uid: result.user.uid,
                    displayName: result.user.displayName,
                    email: result.user.email,
                    photoURL: result.user.photoURL
                }));
                window.location.href = 'index.html';
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    alert('Google sign-in failed: ' + err.message);
                }
            }
        });

        // Guest mode
        document.getElementById('guest-signin').addEventListener('click', () => {
            sessionStorage.setItem('glamathome_user', JSON.stringify({
                uid: 'guest',
                displayName: 'Guest',
                email: 'guest@glamathome.app',
                photoURL: null
            }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
